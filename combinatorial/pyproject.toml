[project]
name = "fast-bo-combinatorial"
version = "0.1.0"
description = "Fast BO on categorical inputs, inside MCBO (see setup_mcbo.sh)."
# Pinned to the versions used for the paper
requires-python = "==3.9.*"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.3.3",
    "torch==2.0.1",
    "gpytorch==1.6.0",
    "networkx==3.2.1",
    "matplotlib==3.7.5",
    "seaborn==0.13.2",
    "joblib==1.1.0",
    "PyYAML==6.0.3",
    "requests==2.27.1",
    "scikit-learn==1.0.2",
    "pymoo==0.6.0",
    "xgboost==1.6.2",
    "tqdm==4.70.0",
    "disjoint-set==0.8.0",
    "setuptools==68.0.0",
]

[tool.uv]
package = false
